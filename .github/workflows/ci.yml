name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Calculator smoke test
        run: |
          python freelance-scoper/scripts/quote.py freelance-scoper/examples/fitness-personal.spec.json --mode brief
          python freelance-scoper/scripts/quote.py freelance-scoper/examples/fitness-uk-client.spec.json --options
          python freelance-scoper/scripts/quote.py freelance-scoper/examples/fitness-uk-client.spec.json --proposal
